<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANSA Flasher - STM32 Firmware Installer</title>
    <meta name="description" content="ANSA Flasher is a plug-and-play install tool for STM32 firmware.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary-accent: #3b82f6;
            --primary-accent-hover: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --secondary-text: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% -20%, #1e3a8a 0%, var(--bg-color) 60%);
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            padding: 2rem;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--secondary-text);
            margin-bottom: 3rem;
            font-weight: 300;
            line-height: 1.6;
        }

        .download-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 3rem 2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .primary-btn {
            display: inline-block;
            background-color: var(--primary-accent);
            color: white;
            text-decoration: none;
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
            margin-bottom: 2rem;
        }

        .primary-btn:hover {
            background-color: var(--primary-accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.5);
        }

        .secondary-downloads {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .secondary-link {
            color: var(--secondary-text);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .secondary-link:hover {
            color: var(--text-color);
        }

        .secondary-link.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Micro-animations for background */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: float 10s infinite ease-in-out alternate;
        }
        
        .blob-1 {
            top: 10%;
            left: 15%;
            width: 300px;
            height: 300px;
            background: #3b82f6;
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: 10%;
            right: 15%;
            width: 250px;
            height: 250px;
            background: #8b5cf6;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.1); }
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 3rem; }
            .hero p { font-size: 1.1rem; }
            .secondary-downloads { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <div class="hero">
            <h1>ANSA Flasher</h1>
            <p>A fast, plug-and-play install tool for flashing STM32 firmware effortlessly.</p>
        </div>

        <div class="download-section">
            <a href="#" id="primary-download" class="primary-btn">Detecting OS...</a>
            
            <div class="secondary-downloads" id="fallback-downloads">
                <a href="https://pub-204a9a1fa59a4769a5622b8b9fb81b14.r2.dev/ansa-flasher-setup.exe" class="secondary-link" data-os="Windows">Windows (.exe)</a>
                <a href="https://pub-204a9a1fa59a4769a5622b8b9fb81b14.r2.dev/ansa-flasher-setup.dmg" class="secondary-link" data-os="macOS">macOS (.dmg)</a>
                <a href="https://pub-204a9a1fa59a4769a5622b8b9fb81b14.r2.dev/ansa-flasher-setup.AppImage" class="secondary-link" data-os="Linux">Linux (.AppImage)</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bucketUrl = 'https://pub-204a9a1fa59a4769a5622b8b9fb81b14.r2.dev';

            const downloads = {
                'Windows': { url: `${bucketUrl}/ansa-flasher-setup.exe`, label: 'Download for Windows' },
                'macOS': { url: `${bucketUrl}/ansa-flasher-setup.dmg`, label: 'Download for macOS' },
                'Linux': { url: `${bucketUrl}/ansa-flasher-setup.AppImage`, label: 'Download for Linux' }
            };

            function detectOS() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                
                if (/windows phone/i.test(userAgent) || /windows/i.test(userAgent)) {
                    return 'Windows';
                }
                if (/macintosh|mac os x/i.test(userAgent)) {
                    return 'macOS';
                }
                if (/linux/i.test(userAgent)) {
                    return 'Linux';
                }
                return 'Windows'; // Default fallback
            }

            const currentOS = detectOS();
            const primaryBtn = document.getElementById('primary-download');
            const fallbackContainer = document.getElementById('fallback-downloads');
            const fallbackLinks = fallbackContainer.querySelectorAll('.secondary-link');

            // Update primary button
            if (downloads[currentOS]) {
                primaryBtn.textContent = downloads[currentOS].label;
                primaryBtn.href = downloads[currentOS].url;
            }

            // Hide the primary OS from the fallback list
            fallbackLinks.forEach(link => {
                if (link.getAttribute('data-os') === currentOS) {
                    link.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
